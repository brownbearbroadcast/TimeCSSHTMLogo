<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Timecode Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="center">
    <h1>Timecode Calculator</h1>
  </div>
  <div id="top" class="start">
    <label id="topLabel" for="start">Start:</label>
    <input class="input" id="start" minlength="11" maxlength="11" inputmode=“numeric” pattern="[0-9]*"
      value="00:00:00:00" />
  </div>
  <p></p>
  <div id ="bottom" class="end">
    <label id="bottomLabel" for="end">End:</label>
    <input class="input" id="end" minlength="11" maxlength="11" inputmode=“numeric” pattern="[0-9]*"
      value="00:00:00:00" />
    <p></p>
  </div>

  <!--sloppy workaround for JQuery unintendeds behavior-->
  <p id="padding"></p>
  <div id = "third" class="logoOut">
     <label id="thirdLabel" for="end">Logo Out:</label><!--<h2>End Timecode</h2>-->
    <input class="input" id="thirdInput" minlength="11" maxlength="11" inputmode=“numeric” pattern="[0-9]*"
      value="00:00:00:00" />
    <p></p>
  </div>
  <div class="center">
    <p>Format: HH:MM:SS:FF</p>
  </div>
  <div class="center">
    <select name="operation" id="operation">
      <option value="Duration" selected>Duration</option>
      <option value="Addition">Addition</option>
      <option value="Subtraction">Subtraction</option>
      <option value="Logo Insertion">Logo Insertion</option>
    </select>

    <button onclick="flagSubmit()" type="button">Submit</button>
  </div>
  <div class="center">
    <h2>Result</h2>
  </div>
  <div class="center">
    <p id="result"></p>
  </div>
  <script src="javascript/DropFrame.js"></script>
  <script src="index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
  <script src="javascript/startInput.js"></script>
  <script src="javascript/endInput.js"></script>
  <script src="javascript/thirdInput.js"></script>
  <script>
    if(document.getElementById("operation").value != "Logo Insertion"){
    $("#third").hide();
    $("#padding").hide();      
    }
    if (document.getElementById("operation").value == "Logo Insertion") {
    console.log(document.getElementById("operation").value);
    $("#third").show();
    $("#padding").show();
    document.getElementById("topLabel").innerHTML = "Seg Start: "
    document.getElementById("top").setAttribute("class","segmentStart");
    document.getElementById("bottomLabel").innerHTML = "Logo In: ";
    document.getElementById("bottom").setAttribute("class","logoIn");
  }
  else if (document.getElementById("operation").value == "Addition") {
   $("#third").hide();
   $("#padding").hide();
   document.getElementById("topLabel").innerHTML = "Original: "
   document.getElementById("top").setAttribute("class","original");
   document.getElementById("bottomLabel").innerHTML = "Addend: ";
   document.getElementById("bottom").setAttribute("class","addend");
  }
  else if (document.getElementById("operation").value == "Subtraction") {
   $("#third").hide();
   $("#padding").hide();
   document.getElementById("topLabel").innerHTML = "Original: "
   document.getElementById("top").setAttribute("class","original");
   document.getElementById("bottomLabel").innerHTML = "Minuend: ";
   document.getElementById("bottom").setAttribute("class","minuend");
  }
  else if (document.getElementById("operation").value == "Duration") {
   $("#third").hide();
   $("#padding").hide();
   document.getElementById("topLabel").innerHTML = "Start: "
   document.getElementById("top").setAttribute("class","start");
   document.getElementById("bottomLabel").innerHTML = "End: ";
   document.getElementById("bottom").setAttribute("class","end");
  }
  </script>

</body>

</html>
